<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#101311">
  <meta name="description" content="Panel de cámara y chat para transmisiones desde el celular.">
  <title>Stream Pocket</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101311;
      --panel: #181c19;
      --well: #0b0e0f;
      --line: #2c352f;
      --text: #f1f5ef;
      --muted: #a9b5ad;
      --accent: #d5fa7c;
      font: 16px/1.4 system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    .wrap { width: min(960px, calc(100% - 24px)); margin-inline: auto; }
    header { display: flex; align-items: center; gap: 9px; padding: 11px 2px; }
    header h1 { font-size: 1.05rem; letter-spacing: -.035em; margin: 0; }
    header svg { width: 27px; height: 27px; padding: 5px; color: var(--accent); background: #283523; border-radius: 8px; }
    main { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
    p { margin: 0; }
    .notice { background: var(--panel); padding: 7px 10px; border-radius: 8px; margin-bottom: 6px; }
    .workspace { display: grid; gap: 6px; align-items: start; }
    .panel { min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
    .camera { position: relative; }
    .fullscreen-control { position: absolute; top: 6px; right: 6px; z-index: 2; text-align: right; }
    #fullscreen-toggle { display: inline-grid; place-items: center; width: 44px; padding: 0; background: #181c19; }
    #fullscreen-toggle svg { width: 20px; height: 20px; }
    #fullscreen-feedback:not(:empty) { margin-top: 4px; padding: 4px 7px; border-radius: 6px; background: var(--panel); }
    .stage { position: relative; display: grid; min-width: 0; background: var(--well); }
    .camera .stage { height: clamp(182px, 32svh, 330px); }
    #camera-frame-slot { min-width: 0; min-height: 0; }
    .camera-idle, .chat-idle {
      background: radial-gradient(ellipse at 50% 20%, #213128 0%, transparent 65%), var(--well);
      display: grid; place-content: center; justify-items: center; gap: 9px; padding: 10px;
    }
    .camera-idle > svg, .chat-idle > svg { color: var(--muted); width: 25px; height: 25px; }
    .camera-idle > svg { color: var(--accent); }
    .camera-facing { border: 0; margin: 0; padding: 0; }
    .camera-choices, #camera-actions { display: flex; gap: 5px; align-items: center; }
    .camera-choices label { position: relative; display: grid; place-items: center; min-height: 44px; padding: 0 12px; border: 1px solid #56645a; border-radius: 8px; cursor: pointer; font-size: .83rem; font-weight: 680; }
    .camera-choices input { position: absolute; opacity: 0; margin: 0; }
    .camera-choices label:has(input:checked), #camera-actions button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: #2d3b23; }
    .camera-choices label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
    #camera-actions { position: relative; z-index: 1; flex-wrap: wrap; padding: 1px 4px; }
    #camera-help { position: absolute; bottom: calc(100% + 4px); left: 4px; max-width: calc(100% - 8px); padding: 4px 7px; border-radius: 6px; background: var(--panel); pointer-events: none; }
    .control-label { flex: 0 0 48px; width: 48px; padding-left: 4px; color: var(--muted); font-size: .75rem; font-weight: 680; }
    .help:empty { display: none; }
    #stop-camera { margin-left: auto; }
    iframe { display: block; width: 100%; height: 100%; border: 0; min-width: 0; min-height: 0; }
    .chat .stage { height: clamp(300px, 50svh, 640px); }
    .chat .stage:has(#chat-idle:not([hidden])):has(#alert-layer[hidden]) { height: 88px; }
    .chat-idle { gap: 5px; color: var(--muted); font-size: .79rem; background: var(--well); }
    #chat-form { padding: 2px 4px; }
    #chat-connected { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 1px 4px; }
    #chat-connected button { padding-inline: 8px; font-size: .76rem; }
    #chat-connected-channel { flex: 1 1 64px; min-width: 0; padding-inline: 4px; font-size: .82rem; font-weight: 680; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .url-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 5px; }
    .chat-row { grid-template-columns: auto minmax(0, 1fr) auto auto; }
    button, input { font: inherit; min-height: 44px; border-radius: 8px; }
    #camera-actions button, #chat-connected button { min-height: 36px; min-width: 44px; padding-block: 1.5px; }
    button { font-size: .83rem; font-weight: 750; background: var(--accent); color: #182114; border: 1px solid transparent; cursor: pointer; padding: 5px 12px; }
    button.secondary { background: #202722; border-color: #3a483e; color: var(--text); }
    button:hover { filter: brightness(1.09); }
    button:disabled { opacity: .55; cursor: default; }
    button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input { padding: 5px 9px; background: var(--well); color: var(--text); border: 1px solid var(--line); width: 100%; min-width: 0; font-size: 16px; }
    .help { color: var(--muted); font-size: .77rem; }
    #chat-feedback { padding: 3px 4px 0; }
    .alert-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .alert-layer iframe { position: absolute; top: 0; left: 0; transform-origin: top left; }
    .utilities { display: grid; gap: 6px; margin-top: 6px; }
    .alerts-settings { padding-inline: 10px; }
    .alerts-settings > summary { display: flex; align-items: center; gap: 6px; min-height: 44px; cursor: pointer; font-size: .85rem; font-weight: 750; }
    .alerts-settings > summary::after { content: '+'; margin-left: auto; font-size: 1.1rem; color: var(--muted); }
    .alerts-settings[open] > summary::after { content: '−'; }
    #alerts-status { color: var(--accent); font-size: .74rem; font-weight: 550; }
    #alerts-form { display: grid; gap: 5px; padding-bottom: 8px; }
    #alerts-feedback { padding: 0 0 8px; }
    .alerts-size { margin-bottom: 8px; }
    .alerts-size summary { min-height: 44px; align-content: center; color: var(--muted); cursor: pointer; font-size: .78rem; }
    .alerts-size .dimensions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
    .alerts-size label { display: grid; gap: 3px; color: var(--muted); font-size: .76rem; }
    .obs { display: grid; gap: 5px; padding: 5px 5px 5px 10px; }
    .obs-row { display: flex; align-items: center; justify-content: space-between; }
    .obs h2 { margin: 0; font-size: .86rem; }
    .screen-reader { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (min-width: 720px), (orientation: landscape) and (min-width: 520px) and (max-height: 600px) {
      .workspace { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: stretch; }
      .chat { display: grid; grid-template-rows: minmax(0, 1fr); }
      .camera .stage { height: clamp(300px, 58svh, 600px); }
      .chat .stage, .chat .stage:has(#chat-idle:not([hidden])):has(#alert-layer[hidden]) { height: auto; min-height: 0; }
    }
    @media (orientation: landscape) and (min-width: 520px) and (max-height: 600px) {
      .wrap {
        width: min(960px, calc(100% - max(16px, env(safe-area-inset-left) + env(safe-area-inset-right))));
      }
      header { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); }
      .workspace {
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        height: max(210px, 100dvh);
      }
      .camera { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; }
      .camera .stage { height: auto; min-height: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>
      <h1>Stream Pocket</h1>
    </header>
    <main>
      <p id="local-notice" class="help notice" hidden>Abrí el panel por HTTPS para usar la cámara.</p>
      <div class="workspace">
        <section class="panel camera" aria-label="Cámara">
          <div class="fullscreen-control" id="fullscreen-control" hidden>
            <button id="fullscreen-toggle" class="secondary" type="button" aria-label="Pantalla completa" title="Pantalla completa">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path id="fullscreen-enter" d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/>
                <path id="fullscreen-exit" d="M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5" style="display:none"/>
              </svg>
            </button>
            <p id="fullscreen-feedback" class="help" role="status"></p>
          </div>
          <div class="stage">
            <div id="camera-empty" class="camera-idle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>
              <fieldset class="camera-facing">
                <legend class="screen-reader">Cámara inicial</legend>
                <div class="camera-choices">
                  <label><input type="radio" name="camera-facing" value="front" checked>Frontal</label>
                  <label><input type="radio" name="camera-facing" value="rear">Trasera</label>
                </div>
              </fieldset>
              <button id="start-camera" type="button">Abrir cámara</button>
            </div>
            <div id="camera-frame-slot" hidden></div>
          </div>
          <div id="camera-actions" hidden>
            <span class="control-label" aria-hidden="true">Cámara:</span>
            <button type="button" class="secondary" data-facing="user" aria-pressed="false" disabled>Frontal</button>
            <button type="button" class="secondary" data-facing="environment" aria-pressed="false" disabled>Trasera</button>
            <button id="stop-camera" type="button" class="secondary" aria-label="Cerrar cámara">Cerrar</button>
            <p id="camera-help" class="help" role="status"></p>
          </div>
          <form id="chat-form">
            <label class="screen-reader" for="chat-channel">Canal de Kick</label>
            <div class="url-row chat-row">
              <span class="control-label" aria-hidden="true">Chat:</span>
              <input id="chat-channel" type="text" placeholder="Canal de Kick" required autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="chat-feedback">
              <button type="submit" class="secondary">Conectar</button>
              <button id="chat-cancel" type="button" class="secondary" hidden>Cancelar</button>
            </div>
            <p class="help" id="chat-feedback" role="status"></p>
          </form>
          <div id="chat-connected" hidden>
            <span class="control-label" aria-hidden="true">Chat:</span>
            <span id="chat-connected-channel"></span>
            <button id="chat-history" type="button" class="secondary" aria-controls="chat-frame">Kick Chat</button>
            <button id="chat-change" type="button" class="secondary">Cambiar</button>
          </div>
        </section>
        <section class="panel chat" aria-label="Chat de Kick">
          <div class="stage">
            <div id="chat-idle" class="chat-idle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a7.5 7.5 0 0 1-7.5 7.5H9l-5 2 1.5-5A7.5 7.5 0 0 1 11 4h2.5a7.5 7.5 0 0 1 7.5 7.5Z"/><path d="M9 11.5h6"/></svg>
              <span>Chat de Kick</span>
            </div>
            <iframe id="chat-frame" title="Chat de Kick" sandbox="allow-scripts allow-same-origin" allow="camera 'none'; microphone 'none'; autoplay 'none'" referrerpolicy="no-referrer" hidden></iframe>
            <div id="alert-layer" class="alert-layer" hidden></div>
          </div>
        </section>
      </div>
      <div class="utilities">
        <details class="panel alerts-settings">
          <summary>Alertas <span id="alerts-status"></span></summary>
          <form id="alerts-form" autocomplete="off">
            <label class="screen-reader" for="alerts-url">Enlace privado de alertas</label>
            <div class="url-row">
              <input id="alerts-url" type="password" required autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Enlace de alertas" aria-describedby="alerts-feedback">
              <button type="submit">Conectar</button>
            </div>
            <button id="alerts-stop" type="button" class="secondary" hidden>Desconectar</button>
          </form>
          <details id="alerts-size" class="alerts-size" hidden>
            <summary>Tamaño del overlay</summary>
            <div class="dimensions">
              <label>Ancho <input id="alerts-width" type="number" value="1920" min="240" max="4096" step="1" required></label>
              <label>Alto <input id="alerts-height" type="number" value="1080" min="120" max="4096" step="1" required></label>
            </div>
          </details>
          <p id="alerts-feedback" class="help" role="status"></p>
        </details>
        <section class="panel obs" aria-labelledby="obs-title">
          <div class="obs-row">
            <h2 id="obs-title">OBS</h2>
            <button id="copy-obs" type="button">Copiar enlace</button>
          </div>
          <label for="obs-url" class="screen-reader">Enlace privado para OBS</label>
          <input id="obs-url" type="text" readonly spellcheck="false" hidden>
          <p id="obs-feedback" class="help" role="status"></p>
        </section>
      </div>
      <noscript>Activá JavaScript.</noscript>
    </main>
  </div>
  <script>
    const get = (id) => document.getElementById(id);
    const landscapePanel = matchMedia('(orientation: landscape) and (min-width: 520px) and (max-height: 600px)');

    function showLandscapePanel() {
      if (landscapePanel.matches) window.scrollTo({ top: 0, behavior: 'instant' });
    }

    if (document.fullscreenEnabled) {
      const fullscreenButton = get('fullscreen-toggle');
      const fullscreenFeedback = get('fullscreen-feedback');
      get('fullscreen-control').hidden = false;

      document.addEventListener('fullscreenchange', () => {
        const active = Boolean(document.fullscreenElement);
        const label = active ? 'Salir de pantalla completa' : 'Pantalla completa';
        fullscreenButton.setAttribute('aria-label', label);
        fullscreenButton.title = label;
        get('fullscreen-enter').style.display = active ? 'none' : '';
        get('fullscreen-exit').style.display = active ? '' : 'none';
        fullscreenFeedback.textContent = '';
      });

      fullscreenButton.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
          showLandscapePanel();
        } catch {
          fullscreenFeedback.textContent = 'El navegador bloqueó la pantalla completa.';
        }
      });
    }

    const vdoOrigin = 'https://vdo.ninja';
    const hash = new URLSearchParams(location.hash.slice(1));
    const savedSession = hash.get('sesion') ?? '';
    const session = /^[a-f0-9]{48}$/.test(savedSession) ? savedSession :
      Array.from(crypto.getRandomValues(new Uint8Array(24)), (byte) => byte.toString(16).padStart(2, '0')).join('');
    if (session !== savedSession && location.protocol !== 'file:') {
      history.replaceState(null, '', '#sesion=' + session);
    }
    const streamId = session.slice(0, 24);
    const password = session.slice(24);

    function vdoUrl(role, options) {
      const url = new URL(vdoOrigin);
      url.searchParams.set(role, streamId);
      for (const option of options) url.searchParams.set(option, '');
      url.hash = new URLSearchParams({ password }).toString();
      return url.href;
    }

    const cameraUrl = vdoUrl('push', ['webcam2', 'mediasettings']);
    const obsUrl = get('obs-url');
    obsUrl.value = vdoUrl('view', ['cleanoutput']);
    get('local-notice').hidden = location.protocol === 'https:';
    const cameraSlot = get('camera-frame-slot');
    const cameraEmpty = get('camera-empty');
    const cameraActions = get('camera-actions');
    const cameraButtons = cameraActions.querySelectorAll('button[data-facing]');
    const stopCamera = get('stop-camera');
    const cameraHelp = get('camera-help');
    let cameraSwitchTimeout;
    let cameraSwitchId = 0;
    let cameraSwitchTarget;

    // Runs inside VDO.Ninja. Its capture code gives facingMode priority over the device picker.
    async function switchVdoFacing(facing, requestId) {
      const reply = (status) => parent.postMessage({ panelCameraSwitch: status, requestId }, session.iframetarget);
      const liveTrack = () => session.streamSrc?.getVideoTracks().find(track => track.readyState === 'live');
      const previousTrack = liveTrack();
      const picker = document.getElementById('videoSource3');
      if (!previousTrack || !picker?.value || picker.value === 'ZZZ') return reply('inactive');
      if (typeof grabVideo !== 'function') return reply('unavailable');
      if (previousTrack.getSettings().facingMode === facing) return reply('switched');

      try {
        session.facingMode = facing;
        activatedPreview = false;
        await grabVideo(session.quality, 'videosource', 'select#videoSource3');
        const deadline = Date.now() + 4500;
        while (Date.now() < deadline) {
          const track = liveTrack();
          if (track && track !== previousTrack) {
            const settings = track.getSettings();
            if (Array.from(picker.options).some(option => option.value === settings.deviceId)) {
              picker.value = settings.deviceId;
            }
            if (settings.facingMode === facing) return reply('switched');
            if (!settings.facingMode && session.facingMode === facing) return reply('requested');
            return reply('unavailable');
          }
          await new Promise(resolve => setTimeout(resolve, 150));
        }
      } catch {
        return reply('unavailable');
      }
      reply('unavailable');
    }

    function disableCameraButtons(disabled) {
      cameraButtons.forEach(button => { button.disabled = disabled; });
    }

    function markCamera(facing) {
      cameraButtons.forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.facing === facing));
      });
    }

    get('start-camera').addEventListener('click', () => {
      const frame = document.createElement('iframe');
      frame.title = 'Cámara y micrófono de VDO.Ninja';
      frame.allow = 'camera https://vdo.ninja; microphone https://vdo.ninja; autoplay https://vdo.ninja';
      frame.referrerPolicy = 'no-referrer';
      const url = new URL(cameraUrl);
      const facing = cameraEmpty.querySelector('input[name="camera-facing"]:checked').value;
      url.searchParams.set('facing', facing);
      if (location.origin !== 'null') url.searchParams.set('iframetarget', location.origin);
      frame.src = url.href;
      frame.addEventListener('load', () => {
        if (cameraSlot.firstElementChild === frame) disableCameraButtons(false);
      }, { once: true });
      cameraSlot.replaceChildren(frame);
      cameraSlot.hidden = false;
      cameraEmpty.hidden = true;
      cameraActions.hidden = false;
      markCamera(facing === 'rear' ? 'environment' : 'user');
      cameraHelp.textContent = '';
      showLandscapePanel();
    });

    cameraButtons.forEach(button => {
      button.addEventListener('click', () => {
        const cameraWindow = cameraSlot.firstElementChild?.contentWindow;
        if (!cameraWindow || button.disabled) return;
        const facing = button.dataset.facing === 'environment' ? 'environment' : 'user';
        const requestId = ++cameraSwitchId;
        cameraSwitchTarget = facing;
        disableCameraButtons(true);
        cameraHelp.textContent = 'Cambiando cámara…';
        cameraSwitchTimeout = setTimeout(() => {
          cameraSwitchTimeout = undefined;
          disableCameraButtons(false);
          cameraHelp.textContent = 'Revisá la vista previa.';
        }, 6500);
        cameraWindow.postMessage({
          function: 'eval',
          value: '(' + switchVdoFacing.toString() + ')(' + JSON.stringify(facing) + ', ' + requestId + ');'
        }, vdoOrigin);
      });
    });

    window.addEventListener('message', (event) => {
      if (!cameraSwitchTimeout || event.origin !== vdoOrigin ||
          event.source !== cameraSlot.firstElementChild?.contentWindow ||
          event.data?.requestId !== cameraSwitchId) return;
      const messages = {
        switched: '',
        requested: 'Revisá la vista previa.',
        inactive: 'Primero iniciá la cámara en VDO.Ninja.',
        unavailable: 'No se pudo cambiar la cámara.'
      };
      const status = event.data?.panelCameraSwitch;
      if (!Object.hasOwn(messages, status)) return;
      clearTimeout(cameraSwitchTimeout);
      cameraSwitchTimeout = undefined;
      disableCameraButtons(false);
      if (status === 'switched' || status === 'requested') {
        markCamera(cameraSwitchTarget);
      }
      cameraHelp.textContent = messages[status];
    });

    stopCamera.addEventListener('click', () => {
      clearTimeout(cameraSwitchTimeout);
      cameraSwitchTimeout = undefined;
      cameraSlot.replaceChildren();
      cameraSlot.hidden = true;
      cameraEmpty.hidden = false;
      cameraActions.hidden = true;
      disableCameraButtons(true);
      get('start-camera').focus({ preventScroll: landscapePanel.matches });
      showLandscapePanel();
    });

    const chatUrl = new URL('https://yuuzito.github.io/Holy-chat-overlay/');
    chatUrl.search = new URLSearchParams({
      channel: 'example',
      sevenTVCosmeticsEnabled: 'true',
      sevenTVEmotesEnabled: 'true',
      theme: 'transparent',
      layout: 'vertical',
      shadow: '0',
      msgShadow: '1',
      textSize: 'large',
      size: '14',
      emoteSize: '22',
      badgeSize: '14',
      font: 'inter',
      fontWeight: '700',
      animation: 'none',
      showPinEnabled: 'false',
      textBackgroundEnabled: 'false',
      textBackgroundWidth: 'min',
      mentionHighlightEnabled: 'false',
      hideBots: 'false',
      hideCommands: 'false',
      deletedMessages: 'hide',
      fade: '0',
      donations: 'true',
      rewards: 'false',
      overlay: 'true',
      background: '#0b0e0fff'
    }).toString();

    const chatFrame = get('chat-frame');
    const chatHistory = get('chat-history');
    const chatForm = get('chat-form');
    const chatInput = get('chat-channel');
    const chatFeedback = get('chat-feedback');
    const chatChange = get('chat-change');
    const chatChannelKey = 'stream-pocket.chat-channel';
    const channelPattern = /^[a-z0-9_-]+$/;
    let activeChannel = '';
    let showingKickChat = false;

    function showChat() {
      chatUrl.searchParams.set('channel', activeChannel);
      chatFrame.src = showingKickChat ? 'https://kick.com/popout/' + encodeURIComponent(activeChannel) + '/chat' : chatUrl.href;
      chatFrame.title = showingKickChat ? 'Kick Chat' : 'Holy Chat';
      chatHistory.textContent = showingKickChat ? 'Holy Chat' : 'Kick Chat';
    }

    function showChatControls(editing) {
      chatForm.hidden = Boolean(activeChannel) && !editing;
      get('chat-connected').hidden = !chatForm.hidden;
      get('chat-cancel').hidden = !activeChannel;
      chatFeedback.textContent = '';
    }

    function openChannel(channel) {
      if (channel !== activeChannel) {
        activeChannel = channel;
        showChat();
      }
      chatFrame.hidden = false;
      get('chat-idle').hidden = true;
      const channelLabel = get('chat-connected-channel');
      channelLabel.textContent = '@' + channel;
      channelLabel.title = channelLabel.textContent;
      showChatControls(false);
    }

    chatForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const channel = chatInput.value.trim().replace(/^@/, '').toLowerCase();
      if (!channelPattern.test(channel)) {
        chatFeedback.textContent = 'Escribí solo el nombre del canal.';
        chatInput.focus();
        return;
      }
      openChannel(channel);
      try {
        localStorage.setItem(chatChannelKey, channel);
      } catch {
        // El chat también funciona si el navegador bloquea el almacenamiento.
      }
      chatChange.focus({ preventScroll: true });
      showLandscapePanel();
    });

    chatChange.addEventListener('click', () => {
      chatInput.value = activeChannel;
      showChatControls(true);
      chatInput.focus({ preventScroll: true });
      chatInput.select();
      showLandscapePanel();
    });

    get('chat-cancel').addEventListener('click', () => {
      showChatControls(false);
      chatChange.focus({ preventScroll: true });
      showLandscapePanel();
    });

    chatHistory.addEventListener('click', () => {
      if (!activeChannel) return;
      showingKickChat = !showingKickChat;
      showChat();
      showLandscapePanel();
    });

    let savedChannel = '';
    try {
      savedChannel = localStorage.getItem(chatChannelKey) || '';
    } catch {
      // El formulario sigue disponible si no se puede leer el almacenamiento.
    }
    if (channelPattern.test(savedChannel)) openChannel(savedChannel);

    const alertProviders = [
      {
        name: 'StreamElements',
        origin: 'https://streamelements.com',
        matches: url => /^\/overlay\/[^/]+\/[^/]+\/?$/.test(url.pathname),
        fixedSize: true
      },
      {
        name: 'Streamlabs',
        origin: 'https://streamlabs.com',
        matches: url => /^\/(?:alert-box\/v3|widgets\/alert-box)\/[^/]+\/?$/.test(url.pathname)
      },
      {
        name: 'BotRix',
        origin: 'https://botrix.live',
        matches: url => /^\/alerts\/?$/.test(url.pathname) && Boolean(url.searchParams.get('bid')?.trim())
      }
    ];
    const alertLayer = get('alert-layer');
    const alertInput = get('alerts-url');
    const alertFeedback = get('alerts-feedback');
    const alertStop = get('alerts-stop');
    const alertSize = get('alerts-size');
    const alertWidth = get('alerts-width');
    const alertHeight = get('alerts-height');
    let activeAlert = null;

    function parseAlertLink(value) {
      try {
        const url = new URL(value.trim());
        if (url.protocol !== 'https:' || url.username || url.password) return null;
        const provider = alertProviders.find(item => item.origin === url.origin && item.matches(url));
        if (provider) return { url, provider };
      } catch {
        // An incomplete or malformed link is handled by the form.
      }
      return null;
    }

    function resizeAlert() {
      if (!activeAlert?.provider.fixedSize) return;
      const { frame } = activeAlert;
      const width = alertWidth.validity.valid ? alertWidth.valueAsNumber : 1920;
      const height = alertHeight.validity.valid ? alertHeight.valueAsNumber : 1080;
      const scale = Math.min(alertLayer.clientWidth / width, alertLayer.clientHeight / height);
      frame.style.width = width + 'px';
      frame.style.height = height + 'px';
      frame.style.left = (alertLayer.clientWidth - width * scale) / 2 + 'px';
      frame.style.transform = 'scale(' + scale + ')';
    }

    new ResizeObserver(resizeAlert).observe(alertLayer.parentElement);
    alertWidth.addEventListener('change', resizeAlert);
    alertHeight.addEventListener('change', resizeAlert);

    get('alerts-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const link = parseAlertLink(alertInput.value);
      if (!link) {
        alertFeedback.textContent = 'Pegá el enlace de alertas de StreamElements, Streamlabs o BotRix.';
        alertInput.focus();
        return;
      }
      const { url, provider } = link;
      const frame = document.createElement('iframe');
      frame.title = 'Alertas de ' + provider.name;
      frame.tabIndex = -1;
      frame.setAttribute('sandbox', 'allow-scripts allow-same-origin');
      frame.allow = "camera 'none'; microphone 'none'; autoplay " + provider.origin;
      frame.referrerPolicy = 'no-referrer';
      frame.src = url.href;
      alertLayer.replaceChildren(frame);
      activeAlert = { frame, provider };
      alertLayer.hidden = false;
      alertSize.hidden = !provider.fixedSize;
      resizeAlert();
      alertInput.value = '';
      alertStop.hidden = false;
      get('alerts-status').textContent = '· ' + provider.name;
      alertFeedback.textContent = 'Probá una alerta desde ' + provider.name + '.';
    });

    alertStop.addEventListener('click', () => {
      activeAlert = null;
      alertLayer.replaceChildren();
      alertLayer.hidden = true;
      alertSize.hidden = true;
      alertSize.open = false;
      alertStop.hidden = true;
      get('alerts-status').textContent = '';
      alertFeedback.textContent = '';
      alertInput.focus();
    });

    get('copy-obs').addEventListener('click', async () => {
      const feedback = get('obs-feedback');
      try {
        await navigator.clipboard.writeText(obsUrl.value);
        obsUrl.hidden = true;
        feedback.textContent = 'Copiado.';
      } catch {
        obsUrl.hidden = false;
        obsUrl.focus();
        obsUrl.select();
        feedback.textContent = 'Enlace seleccionado para copiar.';
      }
    });
  </script>
</body>
</html>
